# Nome da aplicacao
spring.application.name=agenda-app

# ---- Banco H2 (memoria) so para voce testar sem instalar nada ----
spring.datasource.url=jdbc:h2:mem:agendadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cria/atualiza as tabelas automaticamente a partir das entidades (bom para dev, nao para producao)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Quando for usar MySQL de verdade, comente o bloco H2 acima e use isto: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/agenda_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=sua_senha
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080
