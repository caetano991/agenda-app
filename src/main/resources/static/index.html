<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="app">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar">
            <div class="sidebar__brand">
                <button class="icon-btn" id="btnMenu" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <span>Agenda</span>
            </div>

            <button class="btn-primary" id="btnNovaTarefa">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
                Nova tarefa
            </button>

            <div class="sidebar__group">
                <p class="sidebar__title">Status</p>
                <nav class="sidebar__nav" id="filtroStatus" data-tipo="status">
                    <button class="sidebar__item is-active" data-valor="TODAS">Todas <span class="badge" id="cont-TODAS">0</span></button>
                    <button class="sidebar__item" data-valor="A_FAZER">A fazer <span class="badge" id="cont-A_FAZER">0</span></button>
                    <button class="sidebar__item" data-valor="EM_ANDAMENTO">Em andamento <span class="badge" id="cont-EM_ANDAMENTO">0</span></button>
                    <button class="sidebar__item" data-valor="CONCLUIDO">Concluído <span class="badge" id="cont-CONCLUIDO">0</span></button>
                </nav>
            </div>

            <div class="sidebar__group">
                <p class="sidebar__title">Categoria</p>
                <nav class="sidebar__nav" id="filtroCategoria" data-tipo="categoria">
                    <button class="sidebar__item is-active" data-valor="Todas">◆ Todas</button>
                    <button class="sidebar__item" data-valor="Trabalho">▤ Trabalho</button>
                    <button class="sidebar__item" data-valor="Pessoal">◎ Pessoal</button>
                    <button class="sidebar__item" data-valor="Saúde">◎ Saúde</button>
                    <button class="sidebar__item" data-valor="Finanças">◈ Finanças</button>
                    <button class="sidebar__item" data-valor="Outro">◇ Outro</button>
                </nav>
            </div>
        </aside>

        <!-- ===== CONTEÚDO ===== -->
        <main class="content">
            <header class="content__header">
                <div>
                    <h1>Todas as tarefas</h1>
                    <p class="subtitle" id="resumo">carregando…</p>
                </div>
                <div class="header__actions">
                    <input type="search" id="busca" placeholder="Buscar tarefa..." />
                    <select id="filtroPrioridade">
                        <option value="TODAS">Prioridade: Todas</option>
                        <option value="ALTA">Alta</option>
                        <option value="MEDIA">Média</option>
                        <option value="BAIXA">Baixa</option>
                    </select>
                </div>
            </header>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th class="col-check"></th>
                            <th>Tarefa</th>
                            <th>Categoria</th>
                            <th>Prioridade</th>
                            <th>Vencimento</th>
                            <th>Status</th>
                            <th class="col-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaTarefas">
                        <!-- linhas geradas via JavaScript (js/app.js) -->
                    </tbody>
                </table>
                <p id="vazio" class="vazio" hidden>Nenhuma tarefa encontrada.</p>
            </div>
        </main>
    </div>

    <!-- ===== MODAL DE CRIAR/EDITAR TAREFA ===== -->
    <div class="modal" id="modal" hidden>
        <div class="modal__caixa">
            <h2 id="modalTitulo">Nova tarefa</h2>
            <form id="formTarefa">
                <input type="hidden" id="tarefaId" />

                <label>Título
                    <input type="text" id="campoTitulo" required maxlength="120" />
                </label>

                <label>Descrição
                    <textarea id="campoDescricao" rows="3" maxlength="500"></textarea>
                </label>

                <div class="modal__linha">
                    <label>Categoria
                        <select id="campoCategoria">
                            <option>Trabalho</option>
                            <option>Pessoal</option>
                            <option>Saúde</option>
                            <option>Finanças</option>
                            <option>Outro</option>
                        </select>
                    </label>

                    <label>Prioridade
                        <select id="campoPrioridade">
                            <option value="ALTA">Alta</option>
                            <option value="MEDIA">Média</option>
                            <option value="BAIXA">Baixa</option>
                        </select>
                    </label>
                </div>

                <div class="modal__linha">
                    <label>Vencimento
                        <input type="date" id="campoVencimento" />
                    </label>

                    <label>Status
                        <select id="campoStatus">
                            <option value="A_FAZER">A fazer</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                        </select>
                    </label>
                </div>

                <div class="modal__acoes">
                    <button type="button" class="btn-secundario" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
